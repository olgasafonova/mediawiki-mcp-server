name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  changelog:
    name: CHANGELOG stamped
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require a CHANGELOG section for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -qF "## [${VERSION}]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [${VERSION}]' section found. Stamp the CHANGELOG before tagging (v1.33.0 shipped unstamped; this gate prevents a repeat)."
            exit 1
          fi
          echo "Found CHANGELOG section for ${VERSION}."

  build:
    name: Build binaries
    needs: changelog
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            suffix: mac-intel
          - goos: darwin
            goarch: arm64
            suffix: mac-apple-silicon
          - goos: windows
            goarch: amd64
            suffix: windows
            ext: .exe
          - goos: linux
            goarch: amd64
            suffix: linux

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Build MCP server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w -X main.ServerVersion=${GITHUB_REF_NAME#v}" -o mediawiki-mcp-server-${{ matrix.suffix }}${{ matrix.ext }} .

      - name: Build wiki CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME#v}" -o wiki-${{ matrix.suffix }}${{ matrix.ext }} ./cmd/wiki

      - name: Upload MCP server artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mediawiki-mcp-server-${{ matrix.suffix }}
          path: mediawiki-mcp-server-${{ matrix.suffix }}${{ matrix.ext }}

      - name: Upload wiki CLI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiki-${{ matrix.suffix }}
          path: wiki-${{ matrix.suffix }}${{ matrix.ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: binaries
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: binaries/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger MCP Registry publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN-created releases don't fire release:published events
          # (GitHub anti-recursion). Dispatch mcp-registry.yml explicitly.
          # Strip leading 'v' from tag since mcp-registry.yml expects bare semver.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Dispatching mcp-registry.yml for ${GITHUB_REF_NAME} (version=${VERSION})"
          gh workflow run mcp-registry.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f version="${VERSION}"
